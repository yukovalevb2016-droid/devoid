name: Build iOS

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Core ML model (FoodClassifier)
        run: |
          if [ -f WeightLossApp/FoodClassifier.mlmodel ]; then
            echo "Model already present, skipping generation."
          else
            python3 -m pip install --quiet coremltools torchvision
            python3 WeightLossApp/build_model.py
          fi

      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild build \
            -project WeightLossApp.xcodeproj \
            -scheme WeightLossApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
