name: Build iOS

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fetch Core ML model (FoodClassifier)
        run: |
          curl -fsSL -o WeightLossApp/FoodClassifier.mlmodel "https://docs-assets.developer.apple.com/coreml/models/MobileNetV2.mlmodel" \
            || echo "::warning::Model download failed - add WeightLossApp/FoodClassifier.mlmodel manually before building."

      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild build \
            -project WeightLossApp.xcodeproj \
            -scheme WeightLossApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
