name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Core ML model (FoodClassifier)
        run: |
          if [ -e WeightLossApp/FoodClassifier.mlpackage ]; then
            echo "Model already present, skipping generation."
          else
            python3 -m pip install --quiet coremltools "torch==2.7.0" "torchvision==0.22.0"
            python3 WeightLossApp/build_model.py
          fi

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project WeightLossApp.xcodeproj \
            -scheme WeightLossApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/WeightLossApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/WeightLossApp.xcarchive/Products/Applications/WeightLossApp.app" build/ipa/Payload/
          cd build/ipa
          zip -r WeightLossApp.ipa Payload
          cd ../..

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ipa --yes 2>/dev/null || true
          gh release create ipa build/ipa/WeightLossApp.ipa \
            --title "Сборка IPA" \
            --notes "Несподписанный IPA — подпишет сам Sideloadly твоим Apple ID при установке." \
            --latest
