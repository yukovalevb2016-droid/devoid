name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set up Apple signing keychain
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p "temp" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          security add-generic-password -U -s "com.apple.account.AppleAccount" -a "$APPLE_ID" -w "$APPLE_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

      - name: Build Core ML model (FoodClassifier)
        run: |
          if [ -f WeightLossApp/FoodClassifier.mlpackage ]; then
            echo "Model already present, skipping generation."
          else
            python3 -m pip install --quiet coremltools "torch==2.7.0" "torchvision==0.22.0"
            python3 WeightLossApp/build_model.py
          fi

      - name: Build archive
        env:
          CI: "true"
        run: |
          BID="${BUNDLE_ID:-com.example.WeightLossApp}"
          xcodebuild archive \
            -project WeightLossApp.xcodeproj \
            -scheme WeightLossApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/WeightLossApp.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM" \
            -allowProvisioningUpdates

      - name: Export IPA
        env:
          CI: "true"
        run: |
          cat > ExportOptions.plist <<EOPL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOPL
          xcodebuild -exportArchive \
            -archivePath build/WeightLossApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ipa --yes 2>/dev/null || true
          gh release create ipa build/ipa/WeightLossApp.ipa \
            --title "Сборка IPA" \
            --notes "Подписанный IPA (free Apple ID). Ставить через Sideloadly/AltStore; действует 7 дней." \
            --latest
