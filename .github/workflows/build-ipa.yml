name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app (unsigned, for device)
        run: |
          xcodebuild build \
            -project WeightLossApp.xcodeproj \
            -scheme WeightLossApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "WeightLossApp.app" -type d | head -n1)
          echo "Found app at: $APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -r WeightLossApp.ipa Payload
          cd ../..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeightLossApp-ipa
          path: build/ipa/WeightLossApp.ipa
