name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set up Apple signing keychain
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p "temp" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          security add-generic-password -U -s "com.apple.account.AppleAccount" -a "$APPLE_ID" -w "$APPLE_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
        continue-on-error: true

      - name: Build archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          BID="${BUNDLE_ID:-com.example.WeightLossApp}"
          xcodebuild archive \
            -project WeightLossApp.xcodeproj \
            -scheme WeightLossApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/WeightLossApp.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM" \
            -allowProvisioningUpdates

      - name: Export IPA
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          BID="${BUNDLE_ID:-com.example.WeightLossApp}"
          cat > ExportOptions.plist <<EOPL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOPL
          xcodebuild -exportArchive \
            -archivePath build/WeightLossApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeightLossApp-ipa
          path: build/ipa/*.ipa
